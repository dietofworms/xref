<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">uey</title>
  <desc id="d">product_a publishes its public model dim_customers to a manifest store; product_b syncs it and refs it as ref('product_a', 'dim_customers').</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="refline" x1="424" y1="0" x2="856" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff694a"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6576"/>
    </marker>
    <marker id="arrow-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#dots)"/>

  <!-- title -->
  <g text-anchor="middle">
    <text x="640" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f0f3f8" letter-spacing="2">uey</text>
    <text x="640" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b95a7">cross-project refs for dbt v2, no platform plan required</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">

    <!-- product_a -->
    <rect x="48" y="140" width="400" height="190" rx="14" fill="#121824" stroke="#283041"/>
    <circle cx="72" cy="164" r="5" fill="#ff694a"/>
    <text x="86" y="169" font-size="15" font-weight="700" fill="#c9d1dd">product_a</text>
    <text x="424" y="169" font-size="12" fill="#5b6576" text-anchor="end">producer</text>

    <path d="M222,216 C248,216 246,249 270,249" fill="none" stroke="#5b6576" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M222,282 C248,282 246,249 270,249" fill="none" stroke="#5b6576" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="72" y="196" width="150" height="40" rx="8" fill="#1a2130" stroke="#364055"/>
    <text x="147" y="221" font-size="14" fill="#c9d1dd" text-anchor="middle">stg_orders</text>
    <rect x="72" y="262" width="150" height="40" rx="8" fill="#1a2130" stroke="#364055"/>
    <text x="147" y="287" font-size="14" fill="#c9d1dd" text-anchor="middle">stg_customers</text>

    <rect x="272" y="229" width="152" height="40" rx="8" fill="#ff694a" fill-opacity="0.22" filter="url(#glow)"/>
    <rect x="272" y="229" width="152" height="40" rx="8" fill="#2a1d1d" stroke="#ff694a" stroke-width="1.8"/>
    <text x="348" y="254" font-size="14" font-weight="700" fill="#ffd6cc" text-anchor="middle">dim_customers</text>
    <rect x="310" y="214" width="76" height="18" rx="9" fill="#ff694a"/>
    <text x="348" y="227" font-size="11" font-weight="700" fill="#1a0f0c" text-anchor="middle">public</text>

    <!-- product_b -->
    <rect x="832" y="140" width="400" height="190" rx="14" fill="#121824" stroke="#283041"/>
    <circle cx="856" cy="164" r="5" fill="#a78bfa"/>
    <text x="870" y="169" font-size="15" font-weight="700" fill="#c9d1dd">product_b</text>
    <text x="1208" y="169" font-size="12" fill="#5b6576" text-anchor="end">consumer</text>

    <path d="M1006,216 C1032,216 1030,249 1054,249" fill="none" stroke="#5b6576" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M1006,282 C1032,282 1030,249 1054,249" fill="none" stroke="#5b6576" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="856" y="196" width="150" height="40" rx="8" fill="#1d1a2b" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="931" y="221" font-size="14" fill="#ddd6fe" text-anchor="middle">dim_customers</text>
    <text x="931" y="252" font-size="11" fill="#7d6fb3" text-anchor="middle">ephemeral stub</text>
    <rect x="856" y="262" width="150" height="40" rx="8" fill="#1a2130" stroke="#364055"/>
    <text x="931" y="287" font-size="14" fill="#c9d1dd" text-anchor="middle">stg_payments</text>

    <rect x="1056" y="229" width="152" height="40" rx="8" fill="#1a2130" stroke="#364055"/>
    <text x="1132" y="254" font-size="14" fill="#c9d1dd" text-anchor="middle">fct_revenue</text>

    <!-- the cross-project ref -->
    <path d="M426,249 C600,249 690,216 852,216" fill="none" stroke="url(#refline)" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#arrow-ref)">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <rect x="482" y="178" width="316" height="28" rx="14" fill="#0b0f17" stroke="#3a3354"/>
    <text x="640" y="197" font-size="13" text-anchor="middle"><tspan fill="#7d8597">{{ </tspan><tspan fill="#a78bfa">ref</tspan><tspan fill="#7d8597">(</tspan><tspan fill="#ff8f75">'product_a'</tspan><tspan fill="#7d8597">, </tspan><tspan fill="#ffd6cc">'dim_customers'</tspan><tspan fill="#7d8597">) }}</tspan></text>

    <!-- store -->
    <g>
      <path d="M560,358 L560,404 A80,14 0 0 0 720,404 L720,358" fill="#0f1a2b" stroke="#58a6ff" stroke-width="1.6"/>
      <ellipse cx="640" cy="358" rx="80" ry="14" fill="#13233a" stroke="#58a6ff" stroke-width="1.6"/>
      <text x="640" y="394" font-size="12" fill="#9ccbff" text-anchor="middle">manifest.json</text>
      <text x="640" y="440" font-size="12" fill="#5b6576" text-anchor="middle">s3 · gcs · azure · local</text>
    </g>

    <path d="M348,332 C348,376 470,382 554,382" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-store)"/>
    <text x="420" y="402" font-size="13" fill="#9ccbff" text-anchor="middle">$ uey publish</text>
    <path d="M726,382 C810,382 931,376 931,334" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-store)"/>
    <text x="862" y="402" font-size="13" fill="#9ccbff" text-anchor="middle">$ uey sync</text>
  </g>
</svg>
