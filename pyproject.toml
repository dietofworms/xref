[project]
name = "uey"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2024.6",
    "pydantic>=2.14.3",
    "pyyaml>=6",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "dbt-oss==2.0.11",
    "duckdb>=2.0.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["uv-build>0.11,<0.12"]
build-backend = "uv_build"

[project.scripts]
uey = "uey.cli:app"

[project.optional-dependencies]
s3 = [
    "s3fs>=2026.9.0",
]
gcs = [
    "gcsfs>=2026.10.1",
]
azure = [
    "adlfs>=2026.8.0",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; long messages stay on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dbt: runs real dbt builds against DuckDB (slow, needs the dbt driver download)"]
