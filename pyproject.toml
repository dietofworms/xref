[project]
name = "uey"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "dbt-oss==2.0.11",
    "duckdb>=2.0.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv-build>0.11,<0.12"]
build-backend = "uv_build"

[project.scripts]
uey = "uey.cli:app"

[tool.pyright]
typeCheckingMode = "strict"
