models:
  - name: dim_customers
    description: One row per customer with order totals.
    config:
      access: public
    columns:
      - name: customer_id
        description: Primary key.
        data_type: integer
      - name: first_name
        data_type: varchar
      - name: last_name
        data_type: varchar
      - name: email
        data_type: varchar
      - name: signup_date
        data_type: date
      - name: order_count
        data_type: bigint
      - name: lifetime_value
        data_type: decimal(12, 2)
  - name: fct_orders
    description: One row per order.
    config:
      access: public
