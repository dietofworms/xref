name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -m "not dbt"

  dbt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - "dbt-oss==2.0.11"
          - "dbt==2.0.11"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -m dbt
        env:
          XREF_DBT: uvx --from ${{ matrix.dbt }} dbt
